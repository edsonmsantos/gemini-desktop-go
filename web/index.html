<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gemini Desktop - ACP</title>
  <style>
    :root {
      --bg: #121316;
      --surface: #1e1f24;
      --surface-hover: #282a30;
      --border: #2e3038;
      --primary: #4a90e2;
      --primary-hover: #357abd;
      --text: #e1e3e8;
      --text-muted: #8b8f9a;
      --accent: #5e6ad2;
      --success: #34d399;
      --warning: #fbbf24;
      --danger: #f87171;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --font-mono: "JetBrains Mono", Consolas, "Courier New", monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .badge {
      font-size: 0.75rem;
      background: var(--accent);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .workspace-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 1;
      max-width: 500px;
    }
    .workspace-bar label {
      font-size: 0.8rem;
      color: var(--text-muted);
    }
    .workspace-input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85rem;
      flex: 1;
      font-family: var(--font-mono);
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    .msg-user {
      align-self: flex-end;
      background: #2a3b5c;
      color: white;
      padding: 10px 14px;
      border-radius: 8px 8px 2px 8px;
      max-width: 80%;
      white-space: pre-wrap;
    }

    .msg-assistant {
      align-self: flex-start;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 16px;
      border-radius: 8px 8px 8px 2px;
      max-width: 90%;
      width: 100%;
      line-height: 1.5;
    }

    /* Thinking drawer */
    .thought-card {
      background: rgba(94, 106, 210, 0.08);
      border-left: 3px solid var(--accent);
      padding: 8px 12px;
      margin-bottom: 10px;
      border-radius: 0 4px 4px 0;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .thought-title {
      font-weight: 600;
      margin-bottom: 4px;
      color: #a5b4fc;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Tool Call Card */
    .tool-card {
      background: #17181c;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px;
      margin: 8px 0;
      font-size: 0.85rem;
    }
    .tool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .tool-title {
      font-weight: 600;
      color: #93c5fd;
    }
    .status-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 3px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .status-pending { background: rgba(251, 191, 36, 0.2); color: var(--warning); border: 1px solid var(--warning); }
    .status-in_progress { background: rgba(74, 144, 226, 0.2); color: var(--primary); border: 1px solid var(--primary); }
    .status-completed { background: rgba(52, 211, 153, 0.2); color: var(--success); border: 1px solid var(--success); }
    .status-failed { background: rgba(248, 113, 113, 0.2); color: var(--danger); border: 1px solid var(--danger); }

    .tool-input {
      background: #0d0e11;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 6px;
      font-family: var(--font-mono);
      font-size: 0.8rem;
      color: #d1d5db;
      overflow-x: auto;
      white-space: pre-wrap;
    }

    /* Permission Card */
    .permission-card {
      background: #252014;
      border: 1px solid var(--warning);
      border-radius: 6px;
      padding: 12px;
      margin: 10px 0;
    }
    .permission-actions {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }
    .btn-allow {
      background: var(--success);
      color: #052e16;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-allow:hover { opacity: 0.9; }
    .btn-deny {
      background: var(--danger);
      color: #450a0a;
      border: none;
      padding: 6px 14px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-deny:hover { opacity: 0.9; }

    /* Code blocks */
    pre {
      background: #18191f;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 8px 12px;
      overflow-x: auto;
      margin: 8px 0;
      font-family: var(--font-mono);
      font-size: 0.85rem;
    }
    code {
      font-family: var(--font-mono);
      background: rgba(255,255,255,0.08);
      padding: 1px 4px;
      border-radius: 3px;
    }

    footer {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
    }
    .input-container {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    textarea {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 6px;
      font-family: var(--font-sans);
      font-size: 0.95rem;
      resize: none;
      min-height: 48px;
      max-height: 160px;
      outline: none;
    }
    textarea:focus {
      border-color: var(--primary);
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-stop {
      background: var(--danger);
      display: none;
    }
    .btn-stop:hover { background: #dc2626; }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h2>Gemini Desktop</h2>
      <span class="badge">ACP Go</span>
    </div>
    <div class="workspace-bar">
      <label for="workspaceInput">Workspace:</label>
      <input type="text" id="workspaceInput" class="workspace-input" placeholder="Carregando diretório..." />
      <button id="btnNewSession" class="btn" style="padding: 4px 10px; font-size: 0.8rem;">Nova Sessão</button>
    </div>
  </header>

  <div id="messages">
    <div class="msg-assistant">
      Bem-vindo ao <b>GeminiDesktop-Go</b>. Conectado via Agent Client Protocol (ACP). Digite sua mensagem abaixo para começar.
    </div>
  </div>

  <footer>
    <div class="input-container">
      <textarea id="promptInput" rows="1" placeholder="Envie uma mensagem ou comando para o Gemini..."></textarea>
      <button id="btnSend" class="btn">Enviar</button>
      <button id="btnStop" class="btn btn-stop">Parar</button>
    </div>
  </footer>

  <script>
    let currentSessionId = "";
    let isGenerating = false;
    let ws = null;

    const messagesEl = document.getElementById("messages");
    const promptInput = document.getElementById("promptInput");
    const btnSend = document.getElementById("btnSend");
    const btnStop = document.getElementById("btnStop");
    const workspaceInput = document.getElementById("workspaceInput");
    const btnNewSession = document.getElementById("btnNewSession");

    let currentAssistantMsg = null;
    let currentThoughtEl = null;
    let currentTextEl = null;
    let toolCardsMap = new Map();

    function connectWS() {
      const proto = window.location.protocol === "https:" ? "wss:" : "ws:";
      const wsUrl = `${proto}//${window.location.host}/api/stream`;
      ws = new WebSocket(wsUrl);

      ws.onmessage = (event) => {
        try {
          const ev = JSON.parse(event.data);
          handleStreamEvent(ev);
        } catch (err) {
          console.error("Erro ao processar frame WS:", err);
        }
      };

      ws.onclose = () => {
        setTimeout(connectWS, 2000);
      };
    }

    async function initSession() {
      try {
        const cwd = workspaceInput.value || "";
        const res = await fetch("/api/session", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cwd }),
        });
        const data = await res.json();
        currentSessionId = data.sessionId;
        if (data.cwd) workspaceInput.value = data.cwd;
      } catch (err) {
        console.error("Erro ao inicializar sessão:", err);
      }
    }

    function renderMarkdown(text) {
      // Escape HTML
      let escaped = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Code blocks ```code```
      escaped = escaped.replace(/```([\s\S]*?)```/g, (match, code) => {
        return `<pre><code>${code.trim()}</code></pre>`;
      });

      // Inline code `code`
      escaped = escaped.replace(/`([^`]+)`/g, "<code>$1</code>");

      // Negrito **bold**
      escaped = escaped.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");

      // Quebras de linha
      return escaped.replace(/\n/g, "<br/>");
    }

    function startAssistantMessage() {
      const msgDiv = document.createElement("div");
      msgDiv.className = "msg-assistant";

      const thoughtDiv = document.createElement("div");
      thoughtDiv.className = "thought-card";
      thoughtDiv.style.display = "none";
      thoughtDiv.innerHTML = '<div class="thought-title">🧠 Pensamento</div><div class="thought-body"></div>';

      const textDiv = document.createElement("div");
      textDiv.className = "assistant-text";

      msgDiv.appendChild(thoughtDiv);
      msgDiv.appendChild(textDiv);
      messagesEl.appendChild(msgDiv);

      currentAssistantMsg = msgDiv;
      currentThoughtEl = thoughtDiv;
      currentTextEl = textDiv;
      toolCardsMap.clear();

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function handleStreamEvent(ev) {
      if (!currentAssistantMsg && ev.type !== "error") {
        startAssistantMessage();
      }

      switch (ev.type) {
        case "thought_chunk":
          if (ev.thoughtChunk && ev.thoughtChunk.text) {
            currentThoughtEl.style.display = "block";
            const body = currentThoughtEl.querySelector(".thought-body");
            body.dataset.raw = (body.dataset.raw || "") + ev.thoughtChunk.text;
            body.innerHTML = renderMarkdown(body.dataset.raw);
          }
          break;

        case "message_chunk":
          if (ev.messageChunk && ev.messageChunk.text) {
            currentTextEl.dataset.raw = (currentTextEl.dataset.raw || "") + ev.messageChunk.text;
            currentTextEl.innerHTML = renderMarkdown(currentTextEl.dataset.raw);
          }
          break;

        case "tool_call":
          if (ev.toolCall) {
            handleToolCall(ev.toolCall);
          }
          break;

        case "permission_request":
          if (ev.permissionRequest) {
            handlePermissionRequest(ev.permissionRequest);
          }
          break;

        case "turn_done":
        case "error":
          setGenerating(false);
          currentAssistantMsg = null;
          break;
      }

      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function handleToolCall(tc) {
      let card = toolCardsMap.get(tc.id);
      if (!card) {
        card = document.createElement("div");
        card.className = "tool-card";
        currentAssistantMsg.appendChild(card);
        toolCardsMap.set(tc.id, card);
      }

      const statusClass = `status-${tc.status}`;
      const inputStr = tc.rawInput ? JSON.stringify(tc.rawInput, null, 2) : "";

      card.innerHTML = `
        <div class="tool-header">
          <span class="tool-title">🔧 ${tc.title || "Tool Call"}</span>
          <span class="status-badge ${statusClass}">${tc.status}</span>
        </div>
        ${inputStr ? `<pre class="tool-input">${inputStr}</pre>` : ""}
      `;
    }

    function handlePermissionRequest(req) {
      const card = document.createElement("div");
      card.className = "permission-card";
      card.innerHTML = `
        <div style="font-weight: 600; color: var(--warning); margin-bottom: 6px;">
          ⚠️ Autorização necessária para executar ação:
        </div>
        <div><b>${req.toolCall?.title || "Ação do Agente"}</b></div>
        ${req.toolCall?.rawInput ? `<pre class="tool-input">${JSON.stringify(req.toolCall.rawInput, null, 2)}</pre>` : ""}
        <div class="permission-actions">
          <button class="btn-allow" onclick="confirmPermission('${req.callId}', true, this)">Permitir</button>
          <button class="btn-deny" onclick="confirmPermission('${req.callId}', false, this)">Negar</button>
        </div>
      `;
      currentAssistantMsg.appendChild(card);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    window.confirmPermission = async (callId, allow, btn) => {
      const parent = btn.closest(".permission-actions");
      parent.innerHTML = `<span>Decisão registrada: <b>${allow ? "Permitido" : "Negado"}</b></span>`;
      try {
        await fetch("/api/permission", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ callId, allow }),
        });
      } catch (err) {
        console.error("Erro ao enviar permissão:", err);
      }
    };

    function setGenerating(gen) {
      isGenerating = gen;
      btnSend.disabled = gen;
      btnStop.style.display = gen ? "inline-flex" : "none";
      btnSend.style.display = gen ? "none" : "inline-flex";
    }

    async function sendPrompt() {
      const text = promptInput.value.trim();
      if (!text || isGenerating) return;

      // Renderiza mensagem do usuário
      const userDiv = document.createElement("div");
      userDiv.className = "msg-user";
      userDiv.textContent = text;
      messagesEl.appendChild(userDiv);
      promptInput.value = "";
      messagesEl.scrollTop = messagesEl.scrollHeight;

      setGenerating(true);
      startAssistantMessage();

      try {
        const res = await fetch("/api/prompt", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text, sessionId: currentSessionId }),
        });
        if (!res.ok) {
          throw new Error("Erro na requisição: " + res.statusText);
        }
      } catch (err) {
        setGenerating(false);
        const errDiv = document.createElement("div");
        errDiv.className = "msg-assistant";
        errDiv.style.color = "var(--danger)";
        errDiv.textContent = "Erro ao enviar prompt: " + err.message;
        messagesEl.appendChild(errDiv);
      }
    }

    async function cancelPrompt() {
      try {
        await fetch("/api/cancel", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ sessionId: currentSessionId }),
        });
      } catch (err) {
        console.error("Erro ao cancelar:", err);
      }
    }

    btnSend.addEventListener("click", sendPrompt);
    btnStop.addEventListener("click", cancelPrompt);
    btnNewSession.addEventListener("click", initSession);

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendPrompt();
      }
    });

    // Iniciar
    connectWS();
    initSession();
  </script>
</body>
</html>
